# vim:ft=kitty

## name: Gruvbox Dark Hard
## author: Pavel Pertsev (the gruvbox palette, github.com/morhetz/gruvbox)
## license: MIT
## blurb: Gruvbox dark on the hard-contrast ground. Mapped for kitty by hand
## 25-08-2026, replacing Osaka Jade; the accents mirror the editors'
## gruvbox-light-hard from the other side.


#: The basic colors

foreground                      #ebdbb2
background                      #1d2021
selection_foreground            #ebdbb2
selection_background            #504945


#: Cursor colors

cursor                          #ebdbb2
cursor_text_color               #1d2021
cursor_trail_color              none


#: URL underline color when hovering with mouse

url_color                       #83a598


#: kitty window border colors and terminal bell colors

active_border_color             #8ec07c
inactive_border_color           #3c3836
bell_border_color               #fb4934
visual_bell_color               none


#: OS Window titlebar colors

wayland_titlebar_color          system
macos_titlebar_color            system


#: Tab bar colors

active_tab_foreground           #1d2021
active_tab_background           #8ec07c
inactive_tab_foreground         #928374
inactive_tab_background         #3c3836
tab_bar_background              none
tab_bar_margin_color            none


