# What a click on a hyperlink does. The shell tools write the links — rg with
# --hyperlink-format=kitty (a #line fragment per match), eza with --hyperlink
# (a plain file:// path per entry) — and kitty acts on them here. Without this
# file every file:// link falls through to macOS `open`, which picks an
# application by extension and ignores the line. First matching entry wins;
# entries are separated by blank lines. Reference: kitty's open_actions doc.

# A path with a line fragment is a search hit: Zed, at that line.
protocol file
fragment_matches ^[0-9]+$
action launch --type=background zed -- ${FILE_PATH}:${FRAGMENT}

# A directory opens as a new tab there — a tab is named by where it is.
protocol file
mime inode/directory
action launch --type=tab --cwd=${FILE_PATH}

# Any other text file: Zed. mime.types beside this file names the stack's
# extensions Python's table lacks or mislabels; the rest fall to `open`.
protocol file
mime text/*
action launch --type=background zed -- ${FILE_PATH}
