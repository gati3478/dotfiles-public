# vim:ft=kitty

## name: Gruvbox Material Dark Hard
## author: Sainnhe Park (the gruvbox-material palette, github.com/sainnhe/gruvbox-material)
## license: MIT
## blurb: Gruvbox with softer, warmer accents on the same hard ground. Chosen
## over original gruvbox 25-08-2026 on looks. Colors taken from kitty's theme
## collection (rsaihe/gruvbox-material-kitty); the tab and border block is
## hand-tuned below — the collection autogenerates those with values from
## outside the material ramp.


#: The basic colors

foreground                      #d4be98
background                      #1d2021
selection_foreground            #1d2021
selection_background            #d4be98


#: Cursor colors

cursor                          #a89984
cursor_text_color               #1d2021
cursor_trail_color              none


#: URL underline color when hovering with mouse

url_color                       #7daea3


#: kitty window border colors and terminal bell colors

active_border_color             #89b482
inactive_border_color           #3c3836
bell_border_color               #ea6962
visual_bell_color               none


#: OS Window titlebar colors

wayland_titlebar_color          system
macos_titlebar_color            system


#: Tab bar colors
#: Hand-tuned: surfaces use bg3 #3c3836 and dim text grey1 #928374, both
#: verified against sainnhe's palette source (autoload/gruvbox_material.vim,
#: hard/dark branch).

active_tab_foreground           #1d2021
active_tab_background           #89b482
inactive_tab_foreground         #928374
inactive_tab_background         #3c3836
tab_bar_background              none
tab_bar_margin_color            none


#: The basic 16 colors

#: black
color0 #665c54
color8 #928374

#: red
color1 #ea6962
color9 #ea6962

#: green
color2  #a9b665
color10 #a9b665

#: yellow — material puts orange on the dull slot, gold on the bright one
color3  #e78a4e
color11 #d8a657

#: blue
color4  #7daea3
color12 #7daea3

#: magenta
color5  #d3869b
color13 #d3869b

#: cyan
color6  #89b482
color14 #89b482

#: white
color7  #d4be98
color15 #d4be98
