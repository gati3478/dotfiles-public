# `fp` — the kitten choose-files picker. Only what differs from its defaults.
#
# All four of the kitten's scope and appearance switches ship as the literal
# `last`, meaning remember-whatever-was-toggled-last. That makes the picker's
# idea of what exists per-machine mutable state with no declared value, and
# its initial state hidden-files-OFF — while every other searcher here is
# asserted the other way (docs/preferences.md § Shell, pref.search_scope:
# "every searcher sees the same world — hidden yes, .git no").
#
# The three lines below are that sentence, translated, and no one of them is
# the preference alone: show_hidden by itself starts surfacing .git/, which fd
# is explicitly told to exclude, and `ignore` is honoured only while
# respect_ignores is on — so respect_ignores is declared rather than left
# remembering. The kitten's other two `last` switches, sort_by_last_modified
# and show_preview, stay remembered: no stated taste covers either, and
# pinning them would be a preference invented to fill a gap.
show_hidden yes
respect_ignores yes
ignore .git/
