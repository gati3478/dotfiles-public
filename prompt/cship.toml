# ── CShip · Gruvbox Dark Hard — 3-line layout, v1.3 (cship ≥ 1.8.1) ──────────
# 1: directory · branch · git state/status · runtimes  (Starship passthrough)
# 2: model · effort · agent          ⇥ session duration (identity, fill-aligned)
# 3: context · cost · ±lines         ⇥ 5h/7d windows    (metrics, fill-aligned)
#
# Nothing rendered comes from cship's OAuth path. It reads the DEFAULT keychain
# credential regardless of CLAUDE_CONFIG_DIR (cship#194), so under the
# dual-account shim every OAuth-fed field is the personal account's — the
# per-model line 4 was dropped for that on 02-09-2026 (docs/blocked-upstream.md).
# 5h/7d on line 3 arrive on stdin per session and are exact.
#
# $fill right-aligns to the live terminal width: cship reads the controlling
# tty of an ancestor process, then $COLUMNS (Claude Code sets it since
# claude-code#22115 closed, 05-2026), then `width` below, then 80. In a real
# terminal the first two always answer, so `width` only matters where neither
# exists — Windows, the web/desktop apps. Measured 02-09-2026: a 133-column
# window rendered 130 cells with `width = 129` untouched.

"$schema" = 'https://cship.dev/config-schema.json'

[cship]
width = 129
# Columns Claude Code keeps around the statusline (gutter + right margin); cship's
# default of 3 predates Claude Code 2.1.258, which keeps 4 — with 3 every
# right-aligned line lost its last cell to an ellipsis (screenshot, 02-09-2026).
# Re-measure after a Claude Code update: a trailing "…" on line 2 or 3 means
# this is short again.
width_offset = 4
# Line 1 is starship's `format` minus the shell-only modules ($username, $jobs,
# $cmd_duration, $character). cship runs `starship module <name>` per token and
# never reads starship's format, so the allowlist exists twice; preferences.toml
# pins both copies (pref.prompt_curated).
lines = [
  """$directory\
  $git_branch\
  $git_state\
  $git_status\
  $python\
  $java\
  $kotlin\
  $gradle\
  $rust\
  $nodejs""",
  "$cship.model $cship.effort $cship.agent$fill$cship.cost.total_duration",
  "$cship.context_bar  $cship.context_window.used_tokens  $cship.cost  $cship.cost.total_lines_added $cship.cost.total_lines_removed$fill$cship.usage_limits",
]

[cship.fill]
symbol = " "

# ── Line 2 · Identity ────────────────────────────────────

[cship.model]
symbol = " "
style  = "bold fg:#83a598"

# Per-family colours (case-insensitive; legacy *_style fields would win, so
# all families live here). Unknown families fall back to `style` above.
[cship.model.family_style]
fable  = "bold fg:#8ec07c"
opus   = "bold fg:#83a598"
sonnet = "bold fg:#d3869b"
haiku  = "bold fg:#b8bb26"

[cship.agent]
symbol = "↳ "
style  = "fg:#fe8019"

[cship.effort]
symbol       = "󰓅 "
style        = "fg:#83a598"
low_style    = "fg:#b8bb26"
medium_style = "fg:#83a598"
high_style   = "fg:#fabd2f"
xhigh_style  = "bold fg:#fabd2f"
max_style    = "bold fg:#fb4934"

# DISABLED — reads the default (unsuffixed) `Claude Code-credentials` keychain entry, so a
# multi-account CLAUDE_CONFIG_DIR setup always shows the default account in every session, never the
# per-config-dir `Claude Code-credentials-<hash>` token. Re-enable (drop `disabled`, re-add
# $cship.account to line 2) once cship honors CLAUDE_CONFIG_DIR.
# Upstream: https://github.com/stephenleo/cship/issues/194 (still open as of 2026-08-05)
[cship.account]
disabled = true
symbol   = "󰀄 "
format   = "{label}"
style    = "bold fg:#fabd2f"
ttl      = 86400

# Maps each account's raw {organization} → a friendly label; {label} falls back to the org name if
# unmapped. Capture your org name from a live render, then map it here.
[cship.account.labels]
"you@example.com's Organization" = "personal"
"Your Company" = "work"

# ── Line 3 · Metrics ─────────────────────────────────────

[cship.context_bar]
width              = 12
style              = "fg:#8ec07c"
warn_threshold     = 40.0
warn_style         = "fg:#fabd2f"
critical_threshold = 70.0
critical_style     = "bold fg:#fb4934"

[cship.cost]
symbol             = " "
style              = "fg:#b8bb26"
warn_threshold     = 2.0
warn_style         = "fg:#fabd2f"
critical_threshold = 5.0
critical_style     = "bold fg:#fb4934"

# +/- live in the formats (not as line literals) so they vanish with the value
# instead of orphaning as "+ -" in a fresh session.
[cship.cost.total_lines_added]
format = "[+$value]($style)"
style  = "fg:#b8bb26"

[cship.cost.total_lines_removed]
format = "[-$value]($style)"
style  = "fg:#fb4934"

# Human-readable since 1.8.0 (45s / 1m30s / 2h15m30s) — was raw ms when we
# removed it in the 1.5.1 layout; safe to show again.
[cship.cost.total_duration_ms]
symbol = " "
format = "[$symbol$value]($style)"
style  = "fg:#ebdbb2"

[cship.usage_limits]
# ttl governs only the OAuth refetch; 5h/7d arrive on stdin every render. Nothing
# shown comes from OAuth any more, so refetch hourly instead of every 2 minutes —
# each failure costs one render a 2 s stall (02-09-2026).
ttl                = 3600
five_hour_format   = " 5h {pct}% → {reset_at}"
seven_day_format   = " 7d {pct}% → {reset_at}"
separator          = "   "
warn_threshold     = 70.0
warn_style         = "fg:#fabd2f"
critical_threshold = 90.0
critical_style     = "bold fg:#fb4934"

[cship.context_window.used_tokens]
style = "fg:#83a598"
