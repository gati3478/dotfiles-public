# Gruvbox Dark Hard — Starship prompt
format = "$username$directory$git_branch$git_status$python$java$rust$nodejs$cmd_duration$character"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold #fabd2f"

[username]
format = "[$user]($style) "
style_user = "bold #fabd2f"
style_root = "bold #fb4934"
show_always = true

[directory]
format = "[$path]($style) "
style = "bold #ebdbb2"
truncation_length = 3

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"

[git_branch]
format = "on [$symbol$branch]($style) "
style = "bold #8ec07c"

[git_status]
style = "#fabd2f"

[python]
format = "via [$symbol($version)]($style) "
style = "#83a598"

[java]
format = "via [$symbol($version)]($style) "
style = "#fb4934"

[rust]
format = "via [$symbol($version)]($style) "
style = "#fe8019"

[nodejs]
format = "via [$symbol($version)]($style) "
style = "#b8bb26"
